<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255 80" width="120" height="32">
  <defs>
    <!-- White Gradient for Dollar Symbol -->
    <linearGradient id="dollar-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F0FF" />
    </linearGradient>

    <!-- Purple Circle Background Gradient -->
    <linearGradient id="circle-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6841F8" />
      <stop offset="100%" stop-color="#6035FA" />
    </linearGradient>

    <!-- Soft Purple Drop Shadow -->
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#9333EA" flood-opacity="0.35" />
    </filter>

    <!-- Typography Style -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
      
      .brand-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 54px;
        letter-spacing: -1.2px;
        fill: #FFFFFF;
      }
    </style>
  </defs>

  <g transform="translate(5, 5)">
    <!-- ================= PURPLE $ ICON ================= -->
    <g id="dollar-icon" filter="url(#purple-glow)">
      <!-- Circle Background Container -->
      <circle cx="35" cy="35" r="32" fill="url(#circle-bg)" stroke="#9333EA" stroke-width="0.5" />

      <!-- Stylish $ Symbol -->
      <path d="
        M 35 13 V 18 
        M 35 52 V 57 
        M 43 24 C 43 24, 41 21, 35 21 C 28 21, 26 25, 26 28.5 C 26 33, 31 34.5, 36 36 C 41.5 37.5, 45 39.5, 45 44.5 C 45 49.5, 40 52, 35 52 C 28.5 52, 26 48, 26 48
      " 
      fill="none" 
      stroke="url(#dollar-white)" 
      stroke-width="6.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" />
    </g>

    <!-- ================= WEBSITE TYPOGRAPHY ================= -->
    <g id="brand-text">
      <text x="82" y="52" class="brand-text">Hisab</text>
    </g>
  </g>
</svg>
